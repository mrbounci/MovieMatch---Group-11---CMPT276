<!DOCTYPE html>
<html lang="en">
    <title>MovieMatch - Account Creation</title>
    <header>
        <h1>CREATE AN ACCOUNT</h1>
    </header>
    <body>
        <label for="username">Choose your username:</label>
        <input type="text" id="username" name="username"><br>
        <label for="displayname">Choose your display name (You will be able to modify this any time):</label>
        <input type="text" id="displayname" name="displayname"><br><br>
        <label for="password">Choose your password:</label>
        <input type="text" id="password" name="password"><br>
        <label for="password">Retype your password:</label>
        <input type="text" id="confirm_password" name="confirm_password"><br><br>
    </body>
    <footer>
        <button type="button">CONFIRM ACCOUNT CREATION</button>
        <p><a href="/movies/main">View movies</a></p>
    </footer>
</html>
