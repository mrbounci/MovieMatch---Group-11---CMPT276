<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - MovieMatch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>
<div class="auth">
    <div class="auth-intro">
        <a class="brand" th:href="@{/login}">moviematch</a>
        <h1>What are we watching tonight?</h1>
        <p>Everyone suggests a movie, everyone votes, and the group goes with the winner.</p>
    </div>

    <div class="auth-form">
        <h2>Log in</h2>

        <!-- LoginController redirects to /login?error or /login?logout -->
        <div class="alert alert-error" th:if="${param.error}">
            That username and password don't match. Try again.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            You're logged out.
        </div>

        <!-- POST /login is handled by auth/LoginController -->
        <form method="post" th:action="@{/login}">
            <p>
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       autocomplete="username" required autofocus>
            </p>
            <p>
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </p>
            <button type="submit" class="btn-block">Log in</button>
        </form>

        <p class="switch">No account yet? <a th:href="@{/user-handling}">Create one</a></p>
    </div>
</div>
</body>
</html>
