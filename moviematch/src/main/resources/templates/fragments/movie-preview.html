<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Row of small posters for one session on the dashboards.
  Use it inside a session row like this:
      <div th:replace="~{fragments/movie-preview :: preview(${card})}"></div>
  Shows up to 5 movies. A movie with no poster gets a plain tile with its title instead.
-->
<ul class="poster-row poster-row-small" th:fragment="preview(card)" th:unless="${#lists.isEmpty(card.movies)}">
    <li th:each="movie, stat : ${card.movies}" th:if="${stat.index < 5}">
        <a th:href="@{/Asessions/{sid}/movies/{id}(sid=${card.session.uid},id=${movie.uid})}" th:title="${movie.movieTitle}">
            <img th:if="${!#strings.isEmpty(movie.moviePosterUrl)}" th:src="${movie.moviePosterUrl}" th:alt="${movie.movieTitle}" loading="lazy">
            <span class="poster-blank" th:if="${#strings.isEmpty(movie.moviePosterUrl)}" th:text="${movie.movieTitle}">No poster</span>
            <span class="poster-votes" th:if="${movie.movieVoteCount > 0}" th:text="${movie.movieVoteCount}">3</span>
        </a>
        <span class="poster-title" th:text="${movie.movieTitle}">Alien</span>
    </li>
    <li class="poster-more" th:if="${#lists.size(card.movies) > 5}">
        <a th:href="@{/Asessions/{sid}/movies/main(sid=${card.session.uid})}"
           th:text="'+' + (${#lists.size(card.movies)} - 5) + ' more'">+2 more</a>
    </li>
</ul>
</body>
</html>
