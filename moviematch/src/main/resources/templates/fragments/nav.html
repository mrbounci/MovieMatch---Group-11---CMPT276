<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Shared navigation bar. Include it at the top of <body> on any page with:
      <nav th:replace="~{fragments/nav :: nav}"></nav>
  It uses ${loggedIn} and ${currentDisplayName}, which CurrentUserAdvice adds to every page.
-->
<nav class="navbar" th:fragment="nav">
    <a class="brand" th:href="@{/dashboard}">Movie<span>Match</span></a>

    <div class="nav-links" th:if="${loggedIn}">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/Asessions/main}">All sessions</a>
        <a class="nav-host" th:href="@{/host}">Host dashboard</a>
    </div>

    <div class="nav-user" th:if="${loggedIn}">
        <span th:text="${currentDisplayName}">Display name</span>
        <form method="post" th:action="@{/logout}">
            <button type="submit" class="btn-secondary btn-small">Log out</button>
        </form>
    </div>
</nav>
</body>
</html>
