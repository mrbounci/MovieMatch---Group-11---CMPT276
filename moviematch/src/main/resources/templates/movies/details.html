<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movie Details</title>
</head>
<body>
    <main>
        <h1>Movie details</h1>

        <p>Title: <span th:text="${movie.movieTitle}"></span></p>
        <p>Genre: <span th:text="${movie.movieGenre}"></span></p>
        <p>Blurb: <span th:text="${movie.movieBlurb}"></span></p>
        <p>Blurb: <span th:text="${movie.movieRating}"></span></p>

        <p>
            <a th:href="@{/movies/{id}/edit(id=${movie.uid})}">Edit</a>
            <a th:href="@{/movies/{id}/delete(id=${movie.uid})}">Delete</a>
        </p>
        <p><a th:href="@{/movies/main}">Back to movies</a></p>
    </main>
</body>
</html>
