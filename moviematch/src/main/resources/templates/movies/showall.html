<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta movieTitle="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${Asession.sessionTitle}"> </title>
</head>
<body>
    <main>
        <h1 th:text="${Asession.sessionTitle}"> </h1>
        <p><a th:href=" @{/Asessions/{Sid}/movies/new(Sid=${AsessionId})}">Submit a movie</a></p>
        <p th:if="${#lists.isEmpty(movies)}">No movies have been submitted yet.</p>
        <table th:unless="${#lists.isEmpty(movies)}">
            <thead>
                <tr>
                    <th>Movie</th>
                    <th>Genre</th>
                    <th>Rating</th>
                    <th>VotesNotWorking</th>
                    <th>Actions</th>
                    
                </tr>
            </thead>
            <tbody>
                <tr th:each="movie : ${movies}">
                    
                

                    <td th:text="${movie.movieTitle}"></td>
                    <td th:text="${movie.movieGenre}"></td>
                    <td th:text="${movie.movieRating}"></td>
                    <td>
                        <a th:href="@{/Asessions/{Sid}/movies/{id}(Sid=${AsessionId},id=${movie.uid})}">View</a>
                            
                        <a th:href="@{/Asessions/{Sid}/movies/{id}/edit(Sid=${AsessionId},id=${movie.uid})}">Edit</a>
                        
                        <a th:href="@{/Asessions/{Sid}/movies/{id}/delete(Sid=${AsessionId},id=${movie.uid})}">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <p><a th:href="@{/Asessions/main}">Back to sessions</a></p>
    </main>
    
</body>
</html>
