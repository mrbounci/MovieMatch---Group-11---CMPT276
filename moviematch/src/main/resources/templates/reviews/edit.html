<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit review</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
    <main>
        <h1>Edit your review</h1>
        <form method="post"
              th:action="@{/Asessions/{Sid}/movies/{id}/reviews/{rid}/update(Sid=${AsessionId},id=${movieId},rid=${review.uid})}">
            <p>
                <label for="rating">Your rating (1-10)</label>
                <input id="rating" name="rating" type="number" min="1" max="10" required th:value="${review.rating}">
            </p>
            <p>
                <label for="reviewText">Your review</label>
                <textarea id="reviewText" name="reviewText" maxlength="2000" required th:text="${review.reviewText}"></textarea>
            </p>
            <button type="submit">Save review</button>
        </form>
        <p><a th:href="@{/Asessions/{Sid}/movies/{id}/reviews(Sid=${AsessionId},id=${movieId})}">Cancel</a></p>
    </main>
</body>
</html>
