<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reviews</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
    <main>
        <h1>Reviews for <span th:text="${movie.movieTitle}"></span></h1>

        <div class="empty" th:if="${#lists.isEmpty(reviews)}">
            <p>No reviews yet.</p>
            <a class="btn" th:href="@{/Asessions/{Sid}/movies/{id}(Sid=${AsessionId},id=${movie.uid})}">Write the first one</a>
        </div>

        <ul class="session-list" th:unless="${#lists.isEmpty(reviews)}">
            <li class="session-row" th:each="review : ${reviews}">
                <div class="session-main">
                    <h3>
                        <span th:text="${review.rating} + '/10'"></span>
                        <span class="badge" th:if="${currentUserId != null and review.authorUserId == currentUserId}">Your review</span>
                    </h3>
                    <p class="session-blurb" style="white-space: pre-wrap;" th:text="${review.reviewText}"></p>
                </div>
                <div class="session-actions" th:if="${currentUserId != null and review.authorUserId == currentUserId}">
                    <a class="btn btn-secondary btn-small"
                       th:href="@{/Asessions/{Sid}/movies/{id}/reviews/{rid}/edit(Sid=${AsessionId},id=${movie.uid},rid=${review.uid})}">Edit</a>
                    <form method="post"
                          th:action="@{/Asessions/{Sid}/movies/{id}/reviews/{rid}/delete(Sid=${AsessionId},id=${movie.uid},rid=${review.uid})}">
                        <button type="submit" class="btn-danger btn-small">Delete</button>
                    </form>
                </div>
            </li>
        </ul>

        <p><a th:href="@{/Asessions/{Sid}/movies/{id}(Sid=${AsessionId},id=${movie.uid})}">Back to movie</a></p>
    </main>
</body>
</html>
