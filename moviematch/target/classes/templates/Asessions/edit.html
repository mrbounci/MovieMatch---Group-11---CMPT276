<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Session</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
    <main>
        <h1>Edit Session Submission</h1>
        <form method="post"
              th:action="@{/Asessions/{id}/update(id=${AsessionId})}"
              th:object="${Asession}">
            <p>
                <label for="sessionTitle">sessionTitle</label>
                <input id="sessionTitle" type="text" th:field="*{sessionTitle}" required maxlength="100">
                <span th:if="${#fields.hasErrors('sessionTitle')}" th:errors="*{sessionTitle}"></span>
            </p>
            <p>
                <label for="sessionBlurb">Blurb (optional)</label>
                <textarea id="sessionBlurb" th:field="*{sessionBlurb}" maxlength="1000"></textarea>
                <span th:if="${#fields.hasErrors('sessionBlurb')}" th:errors="*{sessionBlurb}"></span>
            </p>
            <button type="submit">Update Session</button>
        </form>
        <p><a th:href="@{/Asessions/{id}(id=${AsessionId})}">Cancel</a></p>
    </main>
</body>
</html>
