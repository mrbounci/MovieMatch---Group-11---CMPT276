<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta movieTitle="viewport" content="width=device-width, initial-scale=1">
    <title>sessions</title>
</head>
<body>
    <main>
        <h1>Session lobby? Screen</h1>
        <p><a href="/Asessions/new">Submit a session</a></p>
        <p th:if="${#lists.isEmpty(Asessions)}">No sessions have been submitted yet.</p>
        <table th:unless="${#lists.isEmpty(Asessions)}">
            <thead>
                <tr>
                    <th>Session</th>
                    <th>Actions</th>
                    
                </tr>
            </thead>
            <tbody>
                <tr th:each="Asession : ${Asessions}">
                    
                

                    <td th:text="${Asession.sessionTitle}"></td>
                    <td>
                        <<a th:href="@{/Asessions/{id}/movies/main(id=${Asession.uid})}">Go to Voting Lobby? </a>
                        
                        <a th:href="@{/Asessions/{id}(id=${Asession.uid})}">View</a>
                            
                        <a th:href="@{/Asessions/{id}/edit(id=${Asession.uid})}">Edit</a>
                        
                        <a th:href="@{/Asessions/{id}/delete(id=${Asession.uid})}">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    
</body>
</html>
