<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit a Movie</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/movie-lookup.js}" defer></script>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
    <main>
        <h1>Submit a Movie</h1>
        <form method="post" th:action="@{/Asessions/{Sid}/movies/add(Sid=${AsessionId})}" th:object="${movie}">
            <input type="hidden" th:field="*{tmdbMovieId}" id="tmdbMovieId">
            <input type="hidden" th:field="*{movieYear}" id="movieYear">
            <input type="hidden" th:field="*{movieSynopsis}" id="movieSynopsis">
            <p>
                <label for="movieTitle">Movie Title</label>
                <input id="movieTitle" type="text" th:field="*{movieTitle}" required maxlength="100">
                <span id="tmdbResults" class="search-dropdown"></span>
                <span th:if="${#fields.hasErrors('movieTitle')}" th:errors="*{movieTitle}"></span>
                <input type="hidden" th:field="*{moviePosterUrl}" />
            </p>
            <!-- <p>
                <label for="movieYear">Year (optional)</label>
                <textarea id="movieYear" th:field="*{movieYear}" maxlength="4"></textarea>
                <span th:if="${#fields.hasErrors('movieYear')}" th:errors="*{movieYear}"></span>
            </p> -->
            <p>
                <label for="movieGenre">Movie Genre</label>
                <select id="movieGenre" th:field="*{movieGenre}" required>
                    <option value="">Choose a Genre</option>
                    <option th:each="genre : ${genres}" th:value="${genre}" th:text="${genre}"></option>
                </select>
                <span th:if="${#fields.hasErrors('movieGenre')}" th:errors="*{movieGenre}"></span>
            </p>
            <p>
                <label for="movieBlurb">Blurb (optional)</label>
                <textarea id="movieBlurb" th:field="*{movieBlurb}" maxlength="1000"></textarea>
                <span th:if="${#fields.hasErrors('movieBlurb')}" th:errors="*{movieBlurb}"></span>
            </p>
            <p>
                <label for="movieRating">Rating (1-10)</label>
                <input id="movieRating" type="number" th:field="*{movieRating}" min="1" max="10" required>
                <span th:if="${#fields.hasErrors('movieRating')}" th:errors="*{movieRating}"></span>
            </p>
            <p>
                <label for="movieDirector">Director (optional)</label>
                <textarea id="movieDirector" th:field="*{movieDirector}" maxlength="100"></textarea>
                <span th:if="${#fields.hasErrors('movieDirector')}" th:errors="*{movieDirector}"></span>
            </p>
            <p>
                <label for="movieWriter">Writer (optional)</label>
                <textarea id="movieWriter" th:field="*{movieWriter}" maxlength="100"></textarea>
                <span th:if="${#fields.hasErrors('movieWriter')}" th:errors="*{movieWriter}"></span>
            </p>
            <p>
                <label for="movieComposer">Composer (optional)</label>
                <textarea id="movieComposer" th:field="*{movieComposer}" maxlength="100"></textarea>
                <span th:if="${#fields.hasErrors('movieComposer')}" th:errors="*{movieComposer}"></span>
            </p>
            <p>
                <label for="movieCinematographer">Cinematographer (optional)</label>
                <textarea id="movieCinematographer" th:field="*{movieCinematographer}" maxlength="100"></textarea>
                <span th:if="${#fields.hasErrors('movieCinematographer')}" th:errors="*{movieCinematographer}"></span>
            </p>
            <button type="submit">Save movie</button>
        </form>
        <p><a th:href="@{/Asessions/{Sid}/movies/main(Sid=${AsessionId})}">View movies</a></p>
    </main>
</body>
</html>
