<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Delete submission</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main>

<h1>Delete Submission?</h1>

<p>
    Are you sure you want to delete:
</p>

<p th:text="${movie.movieTitle}"></p>

<form th:action="@{/Asessions/{Sid}/movies/{id}/delete(Sid=${AsessionId},id=${movie.uid})}"
      method="post">

    <button type="submit" class="btn-danger">
        Delete
    </button>

</form>

<a th:href="@{/Asessions/{Sid}/movies/{id}(Sid=${AsessionId},id=${movie.uid})}">
    Cancel
</a>

</main>
</body>
</html>
